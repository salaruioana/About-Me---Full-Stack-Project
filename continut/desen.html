
    <svg width="900" height="900">
        <g transform="translate(100,100)">

            <defs>
                <linearGradient id="bgFade" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ff9acb" />
                    <stop offset="100%" stop-color="white" />
                </linearGradient>

                <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="25" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>

            <g transform="translate(100,100)">

                <rect x="20" y="-60" width="560" height="560" rx="30" ry="30" fill="url(#bgFade)" filter="url(#halo)"
                    stroke="#c2185b" stroke-width="4" />

                <path d="M300 170 
                C210 80 120 140 180 190
                C230 230 260 200 300 170" fill="#ff69b4" stroke="#c2185b" stroke-width="3">

                    <animate attributeName="fill" from="#ff69b4" to="white" dur="10s" fill="freeze" />
                </path>

                <path d="M300 170 
                C390 80 480 140 420 190
                C370 230 340 200 300 170" fill="#ff69b4" stroke="#c2185b" stroke-width="3">

                    <animate attributeName="fill" from="#ff69b4" to="white" dur="10s" fill="freeze" />
                </path>

                <ellipse cx="300" cy="170" rx="28" ry="35" fill="#ff69b4" stroke="#c2185b" stroke-width="3">

                    <animate attributeName="fill" from="#ff69b4" to="white" dur="10s" fill="freeze" />
                </ellipse>

                <polygon points="260,205 210,290 255,270" fill="#ff69b4" stroke="#c2185b" stroke-width="2">

                    <animate attributeName="fill" from="#ff69b4" to="white" dur="10s" fill="freeze" />
                </polygon>

                <polygon points="340,205 390,290 345,270" fill="#ff69b4" stroke="#c2185b" stroke-width="2">

                    <animate attributeName="fill" from="#ff69b4" to="white" dur="10s" fill="freeze" />
                </polygon>

                <g>
                    <text x="300" y="35" text-anchor="middle" font-size="24" fill="#c2185b">
                        Ioanei îi plac fundițele roz!

                        <animateTransform attributeName="transform" type="rotate" from="0 300 220" to="360 300 220"
                            dur="10s" repeatCount="indefinite" />
                    </text>
                </g>

            </g>
    </svg>
